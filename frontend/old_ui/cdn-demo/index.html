<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DexaUploader CDN Demo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/bootstrap/bootstrap.min.css">
  </head>
  <body>
    <div class="container py-4">
      <h1>DexaUploader - CDN Demo</h1>
      <div id="root"></div>
      <p class="mt-3 text-muted">This demo runs React via CDN and Babel in the browser so you don't need Node/npm.</p>
    </div>

    <!-- React + ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel standalone to compile JSX in the browser (dev only) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Demo component (JSX) -->
    <script type="text/babel" data-presets="react">

// Minimal DexaUploader component adapted for CDN use
function DexaUploader({ apiUrl = '/api/process-dexa' }) {
  const { useState, useRef } = React;
  const [files, setFiles] = useState([]);
  const [status, setStatus] = useState('idle');
  const [result, setResult] = useState(null);
  const fileRef = useRef(null);

  function onFiles(e) {
    const list = e.target.files || e.dataTransfer.files;
    setFiles(Array.from(list));
  }

  async function upload() {
    if (!files.length) return;
    setStatus('uploading');
    const form = new FormData();
    files.forEach((f, i) => form.append('files', f, f.name));
    try {
      const res = await fetch(apiUrl, { method: 'POST', body: form });
      if (!res.ok) throw new Error('Upload failed: ' + res.status);
      const json = await res.json();
      setResult(json);
      setStatus('done');
    } catch (err) {
      setResult({ error: err.message });
      setStatus('error');
    }
  }

  return (
    <div>
      <div className="mb-3">
        <input ref={fileRef} type="file" multiple onChange={onFiles} />
      </div>
      <div className="mb-3">
        <button className="btn btn-primary me-2" onClick={upload} disabled={!files.length || status==='uploading'}>Upload</button>
        <button className="btn btn-secondary" onClick={()=>{ setFiles([]); fileRef.current && (fileRef.current.value='') }}>Clear</button>
      </div>
      <div>
        <strong>Status:</strong> {status}
      </div>
      <div className="mt-3">
        <pre style={{whiteSpace:'pre-wrap',background:'#f8f9fa',padding:10}}>{result ? JSON.stringify(result,null,2) : 'No result yet'}</pre>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DexaUploader />);

    </script>
  </body>
</html>
